<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAY!! 🎉</title>
    <style>
        /* --- RESET & GLOBAL CHAOS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.15) 0%, transparent 40%);
            animation: bgPulse 4s infinite alternate;
        }

        @keyframes bgPulse {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(60deg); }
        }

        /* --- CANVAS FOR PARTICLES --- */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- MAIN CONTENT --- */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 20px;
            margin-top: -30px; /* Pull everything up slightly */
        }

        /* --- GLITCHY NEON HEADER --- */
        h1 {
            font-size: clamp(2rem, 6vw, 5rem);
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px #ff00de,
                0 0 20px #ff00de,
                0 0 40px #ff00de,
                0 0 80px #ff00de;
            animation: glitch 1s infinite alternate;
            letter-spacing: 5px;
        }

        @keyframes glitch {
            0% { transform: translate(0) skew(0deg); text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00de; }
            20% { transform: translate(-2px, 2px) skew(2deg); text-shadow: -2px 2px 0 #00ffff, 2px -2px 0 #ff00de; }
            40% { transform: translate(2px, -2px) skew(-2deg); text-shadow: 2px -2px 0 #00ffff, -2px 2px 0 #ff00de; }
            60% { transform: translate(-2px, -2px) skew(0deg); text-shadow: -2px -2px 0 #00ffff, 2px 2px 0 #ff00de; }
            80% { transform: translate(2px, 2px) skew(2deg); text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00de; }
            100% { transform: translate(0) skew(0deg); text-shadow: 0 0 20px #ff00de, 0 0 40px #ff00de; }
        }

        /* --- THE CHARACTER (HEAD + BODY) --- */
        .character-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            animation: bodyBounce 0.4s infinite alternate ease-in-out;
        }

        /* The Meme Face (Head) */
        .image-container {
            width: clamp(130px, 25vw, 200px);
            height: clamp(130px, 25vw, 200px);
            border-radius: 50%;
            overflow: hidden;
            border: 8px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                inset 0 0 20px #00ffff;
            position: relative;
            background: #111;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) saturate(1.5);
            animation: laughVibe 0.15s infinite alternate;
        }

        @keyframes laughVibe {
            0% { transform: scale(1) rotate(-2deg) translate(2px, -2px); }
            100% { transform: scale(1.08) rotate(2deg) translate(-2px, 2px); }
        }

        /* The Stickman Body */
        .stickman {
            width: clamp(130px, 25vw, 200px);
            height: auto;
            margin-top: -15px; /* Connect body to the head */
            z-index: 5;
            overflow: visible;
            pointer-events: none; /* Let clicks pass through to the face */
        }

        .stickman line {
            stroke: #ff00de;
            stroke-width: 8;
            stroke-linecap: round;
            filter: drop-shadow(0 0 10px #ff00de);
        }

        /* Stickman Dance Moves */
        .stickman .body { animation: bodySway 0.4s infinite alternate ease-in-out; transform-origin: 100px 150px; }
        .stickman .arm-left { animation: armWave 0.3s infinite alternate ease-in-out; transform-origin: 100px 40px; }
        .stickman .arm-right { animation: armWave 0.3s infinite alternate-reverse ease-in-out; transform-origin: 100px 40px; }
        .stickman .leg-left { animation: legKick 0.3s infinite alternate ease-in-out; transform-origin: 100px 150px; }
        .stickman .leg-right { animation: legKick 0.3s infinite alternate-reverse ease-in-out; transform-origin: 100px 150px; }

        @keyframes bodySway {
            0% { transform: rotate(-5deg); }
            100% { transform: rotate(5deg); }
        }

        @keyframes armWave {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(70deg); }
        }

        @keyframes legKick {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(-50deg); }
        }

        @keyframes bodyBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* Crazy Spin Effect for the whole character */
        .spin-effect {
            animation: spinAndZoom 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) !important;
            transform-origin: center center;
        }

        @keyframes spinAndZoom {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.4) rotate(360deg); }
            100% { transform: scale(1) rotate(720deg); }
        }

        /* --- SUBTEXT --- */
        p {
            font-size: clamp(1rem, 2.5vw, 1.8rem);
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
            animation: jiggle 0.5s infinite;
            margin-top: 10px;
        }

        @keyframes jiggle {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, 2px); }
        }

        /* --- CHAOS BUTTON --- */
        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            font-family: inherit;
            font-weight: bold;
            color: #000;
            background: #ff00de;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00de, 0 0 40px #ff00de;
            transition: all 0.2s;
            text-transform: uppercase;
            margin-top: 5px;
        }

        button:hover {
            transform: scale(1.1) rotate(5deg);
            background: #00ffff;
            box-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff;
        }

        button:active {
            transform: scale(0.9);
        }

        /* --- SCREEN SHAKE ANIMATION --- */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- Canvas for the particle explosion -->
    <canvas id="heartCanvas"></canvas>

    <div class="content" id="mainContent">
        <h1 data-text="HAPPY BIRTHDAY">HAPPY BIRTHDAY</h1>
        
        <div class="character-wrapper" id="characterWrapper">
            <div class="image-container" id="memeFaceContainer">
                <!-- Make sure this matches your image name! -->
                <img src="meme.png" alt="Laughing Meme" id="memeFace">
            </div>
            
            <!-- The Stickman Body -->
            <svg class="stickman" viewBox="0 0 200 300" preserveAspectRatio="xMidYMid meet">
                <!-- Body -->
                <line class="body" x1="100" y1="0" x2="100" y2="150" />
                <!-- Arms -->
                <line class="arm-left" x1="100" y1="40" x2="40" y2="100" />
                <line class="arm-right" x1="100" y1="40" x2="160" y2="100" />
                <!-- Legs -->
                <line class="leg-left" x1="100" y1="150" x2="60" y2="250" />
                <line class="leg-right" x1="100" y1="150" x2="140" y2="250" />
            </svg>
        </div>

        <p>HE'S GOT MOVES! 🕺💃🔥</p>
        
        <button id="partyBtn">CLICK FOR MORE CHAOS</button>
    </div>

    <script>
        // --- CANVAS SETUP ---
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PARTICLE CLASS ---
        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 30 + 15;
                const speedMultiplier = isExplosion ? 5 : 2;
                this.speedX = (Math.random() - 0.5) * speedMultiplier * 2;
                this.speedY = (Math.random() - 0.5) * speedMultiplier * 2 - (isExplosion ? 0 : 2);
                this.opacity = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.isExplosion = isExplosion;
                
                const emojis = ['❤️', '💖', '💘', '💝', '🎉', '🎂', '✨', '🔥', '💯', '🥳'];
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                
                if (this.speedY > -5 && !this.isExplosion) {
                    this.speedY -= 0.05;
                }

                this.opacity -= this.decay;
                if (this.opacity < 0) this.opacity = 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        // --- ANIMATION LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (particles.length < 100 && Math.random() > 0.3) {
                const newParticle = new Particle(Math.random() * canvas.width, canvas.height + 50);
                newParticle.speedY = -(Math.random() * 2 + 1);
                newParticle.speedX = (Math.random() - 0.5) * 1;
                particles.push(newParticle);
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                if (p.opacity <= 0 || p.y < -100 || p.x < -100 || p.x > canvas.width + 100) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- MOUSE INTERACTION ---
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
            
            if (Math.random() > 0.6) {
                const p = new Particle(mouse.x, mouse.y);
                p.speedX *= 0.5;
                p.speedY *= 0.5;
                p.size = Math.random() * 20 + 10;
                particles.push(p);
            }
        });

        // --- CHARACTER INTERACTION ---
        const memeFace = document.getElementById('memeFace');
        const characterWrapper = document.getElementById('characterWrapper');

        // Make the whole character spin when tapped
        characterWrapper.addEventListener('click', (e) => {
            characterWrapper.classList.add('spin-effect');
            
            setTimeout(() => {
                characterWrapper.classList.remove('spin-effect');
            }, 1000);

            // Explode a bunch of emojis from the character
            const rect = characterWrapper.getBoundingClientRect();
            const charX = rect.left + rect.width / 2;
            const charY = rect.top + rect.height / 2;
            
            for (let i = 0; i < 60; i++) {
                const p = new Particle(charX, charY, true);
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 12 + 5;
                p.speedX = Math.cos(angle) * velocity;
                p.speedY = Math.sin(angle) * velocity;
                p.decay = 0.015;
                particles.push(p);
            }
        });

        // --- CLICK INTERACTION (CHAOS BUTTON) ---
        document.getElementById('partyBtn').addEventListener('click', (e) => {
            document.body.classList.add('shake');
            setTimeout(() => {
                document.body.classList.remove('shake');
            }, 500);

            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 100; i++) {
                const p = new Particle(centerX, centerY, true);
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 15 + 5;
                p.speedX = Math.cos(angle) * velocity;
                p.speedY = Math.sin(angle) * velocity;
                p.decay = Math.random() * 0.01 + 0.005;
                particles.push(p);
            }
            
            for (let i = 0; i < 20; i++) {
                const p = new Particle(e.clientX, e.clientY, true);
                particles.push(p);
            }
        });

        // --- INITIAL BURST ON LOAD ---
        window.addEventListener('load', () => {
            for (let i = 0; i < 50; i++) {
                const p = new Particle(window.innerWidth / 2, window.innerHeight / 2, true);
                p.speedX = (Math.random() - 0.5) * 20;
                p.speedY = (Math.random() - 0.5) * 20;
                particles.push(p);
            }
        });
    </script>
</body>
</html>
