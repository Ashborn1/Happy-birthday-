<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAPPY BIRTHDAY!! 🎉</title>
    <style>
        /* --- RESET & GLOBAL CHAOS --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: white;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Marker Felt', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(255, 0, 128, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 255, 0.15) 0%, transparent 40%);
            animation: bgPulse 4s infinite alternate;
        }

        @keyframes bgPulse {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(60deg); }
        }

        /* --- CANVAS FOR PARTICLES --- */
        #heartCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none; /* Let clicks pass through to buttons */
        }

        /* --- MAIN CONTENT --- */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        /* --- GLITCHY NEON HEADER --- */
        h1 {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            text-transform: uppercase;
            color: #fff;
            text-shadow: 
                0 0 10px #ff00de,
                0 0 20px #ff00de,
                0 0 40px #ff00de,
                0 0 80px #ff00de;
            animation: glitch 1s infinite alternate;
            letter-spacing: 5px;
        }

        @keyframes glitch {
            0% { transform: translate(0) skew(0deg); text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00de; }
            20% { transform: translate(-2px, 2px) skew(2deg); text-shadow: -2px 2px 0 #00ffff, 2px -2px 0 #ff00de; }
            40% { transform: translate(2px, -2px) skew(-2deg); text-shadow: 2px -2px 0 #00ffff, -2px 2px 0 #ff00de; }
            60% { transform: translate(-2px, -2px) skew(0deg); text-shadow: -2px -2px 0 #00ffff, 2px 2px 0 #ff00de; }
            80% { transform: translate(2px, 2px) skew(2deg); text-shadow: 2px 2px 0 #00ffff, -2px -2px 0 #ff00de; }
            100% { transform: translate(0) skew(0deg); text-shadow: 0 0 20px #ff00de, 0 0 40px #ff00de; }
        }

        /* --- THE MEME FACE --- */
        .image-container {
            width: clamp(200px, 40vw, 350px);
            height: clamp(200px, 40vw, 350px);
            border-radius: 50%;
            overflow: hidden;
            border: 8px solid #00ffff;
            box-shadow: 
                0 0 20px #00ffff,
                inset 0 0 20px #00ffff;
            animation: wobble 2s infinite ease-in-out, borderPulse 1s infinite alternate;
            position: relative;
            background: #111;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.2) saturate(1.5);
            /* The constant laughing vibration */
            animation: laughVibe 0.15s infinite alternate;
        }

        @keyframes wobble {
            0%, 100% { transform: rotate(-6deg) scale(1); }
            50% { transform: rotate(6deg) scale(1.1); }
        }

        @keyframes borderPulse {
            0% { border-color: #00ffff; box-shadow: 0 0 20px #00ffff, inset 0 0 20px #00ffff; }
            100% { border-color: #ff00de; box-shadow: 0 0 40px #ff00de, inset 0 0 40px #ff00de; }
        }

        @keyframes laughVibe {
            0% { transform: scale(1) rotate(-2deg) translate(2px, -2px); }
            100% { transform: scale(1.08) rotate(2deg) translate(-2px, 2px); }
        }

        .spin-effect {
            animation: spinAndZoom 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) !important;
        }

        @keyframes spinAndZoom {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.5) rotate(360deg); }
            100% { transform: scale(1) rotate(720deg); }
        }

        /* --- SUBTEXT --- */
        p {
            font-size: clamp(1.2rem, 3vw, 2rem);
            color: #fff;
            text-shadow: 0 0 10px #00ffff;
            animation: jiggle 0.5s infinite;
        }

        @keyframes jiggle {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
            100% { transform: translate(2px, 2px); }
        }

        /* --- CHAOS BUTTON --- */
        button {
            padding: 15px 30px;
            font-size: 1.5rem;
            font-family: inherit;
            font-weight: bold;
            color: #000;
            background: #ff00de;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff00de, 0 0 40px #ff00de;
            transition: all 0.2s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.1) rotate(5deg);
            background: #00ffff;
            box-shadow: 0 0 40px #00ffff, 0 0 80px #00ffff;
        }

        button:active {
            transform: scale(0.9);
        }

        /* --- SCREEN SHAKE ANIMATION --- */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-8px, 0, 0); }
            40%, 60% { transform: translate3d(8px, 0, 0); }
        }
    </style>
</head>
<body>

    <!-- Canvas for the particle explosion -->
    <canvas id="heartCanvas"></canvas>

    <div class="content" id="mainContent">
        <h1 data-text="HAPPY BIRTHDAY">HAPPY BIRTHDAY</h1>
        
        <div class="image-container">
            <!-- Make sure this matches your image name! -->
            <img src="meme.png" alt="Laughing Meme" id="memeFace">
        </div>

        <p>LET'S GOOOOOO! 🎂🔥🎈</p>
        
        <button id="partyBtn">CLICK FOR MORE CHAOS</button>
    </div>

    <script>
        // --- CANVAS SETUP ---
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null };

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- PARTICLE CLASS ---
        class Particle {
            constructor(x, y, isExplosion = false) {
                this.x = x;
                this.y = y;
                // Randomize size
                this.size = Math.random() * 30 + 15;
                // Randomize speed
                const speedMultiplier = isExplosion ? 5 : 2;
                this.speedX = (Math.random() - 0.5) * speedMultiplier * 2;
                this.speedY = (Math.random() - 0.5) * speedMultiplier * 2 - (isExplosion ? 0 : 2);
                // Randomize opacity
                this.opacity = 1;
                this.decay = Math.random() * 0.02 + 0.01;
                // Randomize rotation
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.2;
                this.isExplosion = isExplosion;
                
                // Array of chaotic emojis
                const emojis = ['❤️', '💖', '💘', '💝', '🎉', '🎂', '✨', '🔥', '💯', '🥳'];
                this.emoji = emojis[Math.floor(Math.random() * emojis.length)];
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.rotation += this.rotationSpeed;
                
                // Float upwards slightly if not exploding
                if (this.speedY > -5 && !this.isExplosion) {
                    this.speedY -= 0.05;
                }

                // Fade out
                this.opacity -= this.decay;
                if (this.opacity < 0) this.opacity = 0;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.opacity;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.font = `${this.size}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(this.emoji, 0, 0);
                ctx.restore();
            }
        }

        // --- ANIMATION LOOP ---
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Spawn ambient hearts floating up
            if (particles.length < 100 && Math.random() > 0.3) {
                const newParticle = new Particle(Math.random() * canvas.width, canvas.height + 50);
                // Override speed for ambient floating
                newParticle.speedY = -(Math.random() * 2 + 1);
                newParticle.speedX = (Math.random() - 0.5) * 1;
                particles.push(newParticle);
            }

            // Update and draw
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.update();
                p.draw();

                // Remove dead particles
                if (p.opacity <= 0 || p.y < -100 || p.x < -100 || p.x > canvas.width + 100) {
                    particles.splice(i, 1);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();

        // --- MOUSE INTERACTION ---
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.x;
            mouse.y = e.y;
            
            // Spawn a trail of hearts on mouse move
            if (Math.random() > 0.6) {
                const p = new Particle(mouse.x, mouse.y);
                p.speedX *= 0.5;
                p.speedY *= 0.5;
                p.size = Math.random() * 20 + 10;
                particles.push(p);
            }
        });

        // --- MEME FACE INTERACTION ---
        const memeFace = document.getElementById('memeFace');
        const imageContainer = document.querySelector('.image-container');

        // Make the face spin when tapped
        memeFace.addEventListener('click', (e) => {
            // Add the spin class
            memeFace.classList.add('spin-effect');
            
            // Remove it after 1 second so it can be clicked again
            setTimeout(() => {
                memeFace.classList.remove('spin-effect');
            }, 1000);

            // Explode a bunch of emojis right from the face!
            const rect = memeFace.getBoundingClientRect();
            const faceX = rect.left + rect.width / 2;
            const faceY = rect.top + rect.height / 2;
            
            for (let i = 0; i < 50; i++) {
                const p = new Particle(faceX, faceY, true);
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 10 + 5;
                p.speedX = Math.cos(angle) * velocity;
                p.speedY = Math.sin(angle) * velocity;
                p.decay = 0.02; // Fade out moderately fast
                particles.push(p);
            }
        });

        // Make the container scale up slightly when you hover (for desktop)
        imageContainer.addEventListener('mouseenter', () => {
            imageContainer.style.transform = 'scale(1.1)';
            imageContainer.style.borderColor = '#ff00de';
            imageContainer.style.boxShadow = '0 0 40px #ff00de, inset 0 0 40px #ff00de';
        });
        
        imageContainer.addEventListener('mouseleave', () => {
            imageContainer.style.transform = 'scale(1)';
            imageContainer.style.borderColor = '#00ffff';
            imageContainer.style.boxShadow = '0 0 20px #00ffff, inset 0 0 20px #00ffff';
        });

        // --- CLICK INTERACTION (CHAOS BUTTON) ---
        document.getElementById('partyBtn').addEventListener('click', (e) => {
            // Shake the screen
            document.body.classList.add('shake');
            setTimeout(() => {
                document.body.classList.remove('shake');
            }, 500);

            // Explode particles from the center
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < 100; i++) {
                const p = new Particle(centerX, centerY, true);
                // Make explosion particles fly outwards
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 15 + 5;
                p.speedX = Math.cos(angle) * velocity;
                p.speedY = Math.sin(angle) * velocity;
                p.decay = Math.random() * 0.01 + 0.005; // Slower decay for explosion
                particles.push(p);
            }
            
            // Spawn a few from the click position too
            for (let i = 0; i < 20; i++) {
                const p = new Particle(e.clientX, e.clientY, true);
                particles.push(p);
            }
        });

        // --- INITIAL BURST ON LOAD ---
        window.addEventListener('load', () => {
            for (let i = 0; i < 50; i++) {
                const p = new Particle(window.innerWidth / 2, window.innerHeight / 2, true);
                p.speedX = (Math.random() - 0.5) * 20;
                p.speedY = (Math.random() - 0.5) * 20;
                particles.push(p);
            }
        });
    </script>
</body>
</html>
